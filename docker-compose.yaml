services:
  api:
    build: .
    command: npm run dev

    ports:
      - "5000:5000"

    volumes:
      - .:/app
      - /app/node_modules

    env_file:
      - .env

    depends_on:
      - postgres

  postgres:
    image: postgres:16

    ports:
      - "5432:5432"

    environment:
      POSTGRES_DB: docdock
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
