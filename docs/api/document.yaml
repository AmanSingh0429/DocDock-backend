                deletedAt: null

      400:
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiError"
            example:
              statusCode: 400
              success: false
              message: Document is not deleted
              errors: []

      401:
        $ref: "#/components/responses/UnauthorizedError"

      403:
        $ref: "#/components/responses/ForbiddenError"

      404:
        description: Not found
        content:
          application/json:
