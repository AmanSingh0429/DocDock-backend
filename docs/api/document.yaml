/orgs/{orgId}/docs/{docId}:
  get:
    summary: Get document
    description: |
      Retrieves a document from an organization.

      **Authentication:** Required

      **Permissions:** `document.read`.
    tags:
      - Documents
    security:
      - BearerAuth: []
    parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: integer
        description: Organization ID
        example: 1
      - in: path
        name: docId
        required: true
        schema:
          type: integer
        description: Document ID
        example: 1
    responses:
      200:
        description: Document retrieved successfully
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ApiResponse"
                - type: object
                  properties:
                    data:
                      $ref: "#/components/schemas/Document"
            example:
              statusCode: 200
              success: true
              message: Document fetched successfully
              data:
                id: 1
                folderId: 1
                orgId: 1
                currentVersionId: 1
                createdBy: 1
                name: Acme Corp
                createdAt: "2022-01-01T00:00:00.000Z"
                deletedAt: null
      401:
        $ref: "#/components/responses/UnauthorizedError"

      403:
        $ref: "#/components/responses/ForbiddenError"

      404:
        description: Not Found
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiError"
            example:
              statusCode: 404
              success: false
              message: The requested document not found
              errors: []
      500:
        $ref: "#/components/responses/InternalServerError"

  patch:
    summary: Rename document
    description: |
      Renames a existing document in an organization.

      **Authentication:** Required

      **Permissions:** `document.rename` on document
    tags:
      - Documents
    security:
      - BearerAuth: []
    parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: integer
        description: Organization ID
        example: 1
      - in: path
        name: docId
        required: true
        schema:
          type: integer
        description: Document ID
        example: 1
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - newDocName
            properties:
              newDocName:
                type: string
                example: Acme Corp
    responses:
      200:
        description: Document retrieved successfully
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ApiResponse"
                - type: object
                  properties:
                    data:
                      $ref: "#/components/schemas/Document"
            example:
              statusCode: 200
              success: true
              message: Document fetched successfully
              data:
                id: 1
                folderId: 1
                orgId: 1
                currentVersionId: 1
                createdBy: 1
                name: Acme Corp
                createdAt: "2022-01-01T00:00:00.000Z"
                deletedAt: null

      400:
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiError"
            examples:
              MISSING_DOC_NAME:
                summary: Missing Document Name
                value:
                  statusCode: 400
                  success: false
                  message: Document name is required
                  errors: []

              REPEATED_DOC_NAME:
                summary: Repeated Document Name
                value:
                  statusCode: 400
                  success: false
                  message: New name must be different from current name
                  errors: []

      401:
        $ref: "#/components/responses/UnauthorizedError"

      403:
        $ref: "#/components/responses/ForbiddenError"

      404:
        description: Not Found
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiError"
            example:
              statusCode: 404
              success: false
              message: Document not found
              errors: []
      409:
        description: Conflict
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiError"
            example:
              statusCode: 409
              success: false
              message: Document with same name already exists
              errors: []

      500:
        $ref: "#/components/responses/InternalServerError"

  delete:
    summary: Delete document
    description: |
      Soft Deletes a existing document in an organization.

      **Authentication:** Required

      **Permissions:** `document.delete` on document
    tags:
      - Documents
    security:
      - BearerAuth: []
    parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: integer
        description: Organization ID
        example: 1
      - in: path
        name: docId
        required: true
        schema:
          type: integer
        description: Document ID
        example: 1
    responses:
      200:
        description: Document deleted successfully
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ApiResponse"
                - type: object
                  properties:
                    data:
                      $ref: "#/components/schemas/Document"
            example:
              statusCode: 200
              success: true
              message: Document deleted
              data:
                id: 1
                folderId: 1
                orgId: 1
                currentVersionId: 1
                createdBy: 1
                name: Acme Corp
                createdAt: "2022-01-01T00:00:00.000Z"
                deletedAt: "2022-01-01T00:00:00.000Z"

      401:
        $ref: "#/components/responses/UnauthorizedError"

      403:
        $ref: "#/components/responses/ForbiddenError"

      404:
        description: Not Found
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiError"
            example:
              statusCode: 404
              success: false
              message: Document not found or already deleted
              errors: []

      500:
        $ref: "#/components/responses/InternalServerError"

/orgs/{orgId}/docs/:
  post:
    summary: Create document
    description: |
      Creates a new document in an organization.

      **Authentication:** Required

      **Permissions:** `document.create` on location folder
    tags:
      - Documents
    security:
      - BearerAuth: []
    parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: integer
        description: Organization ID
        example: 1
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required:
              - docName
              - folderId
              - file
            properties:
              docName:
                type: string
                example: Acme Corp
              folderId:
                type: integer
                example: 1
              file:
                type: string
                format: binary
                description: Document file to upload
    responses:
      200:
        description: Document created successfully
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ApiResponse"
                - type: object
                  properties:
                    data:
                      $ref: "#/components/schemas/Document"
            example:
              statusCode: 200
              success: true
              message: Document created
              data:
                id: 1
                folderId: 1
                orgId: 1
                currentVersionId: 1
                createdBy: 1
                name: Acme Corp
                createdAt: "2022-01-01T00:00:00.000Z"
                deletedAt: null

      400:
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiError"
            examples:
              MISSING_DOC_DETAILS:
                summary: Missing Document Details
                value:
                  statusCode: 400
                  success: false
                  message: Document name & file is required
                  errors: []

              INVALID_FILE:
                summary: Invalid File
                value:
                  statusCode: 400
                  success: false
                  message: Invalid file upload
                  errors: []

      401:
        $ref: "#/components/responses/UnauthorizedError"

      403:
        $ref: "#/components/responses/ForbiddenError"

      404:
        description: Not Found
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiError"
            example:
              statusCode: 404
              success: false
              message: Parent folder not found
              errors: []

      409:
        description: Conflict
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiError"
            example:
              statusCode: 404
              success: false
              message: Document with same name already exists
              errors: []

      500:
        description: Internal Server Error
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiError"
            examples:
              MISSING_ROOT_FOLDER:
                summary: Org has no root folder
                value:
                  statusCode: 500
                  success: false
                  message: Root folder not found
                  errors: []

              SERVER_ERROR:
                summary: Internal Server Error
                value:
                  statusCode: 500
                  success: false
                  message: Internal Server Error
                  errors: []

