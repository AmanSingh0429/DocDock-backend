      Restores a soft deleted folder.

      **Authentication:** Required

      **Permissions:** `folder.restore` on folder
    tags:
      - Folders
    security:
      - BearerAuth: []
    parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: integer
        description: Organization ID
        example: 1
      - in: path
        name: folderId
        required: true
        schema:
          type: integer
        description: Folder ID
        example: 1
    responses:
      200:
        description: Folder Restored Successfully
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ApiResponse"
                - type: object
                  properties:
                    data:
                      $ref: "#/components/schemas/Folder"
            example:
              statusCode: 200
              success: true
              message: Folder moved
              data:
                id: 1
                orgId: 1
                createdBy: 1
                name: Acme Corp
                parentFolderId: 1
                createdAt: "2022-01-01T00:00:00.000Z"
                deletedAt: null
                isRoot: false

      400:
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiError"
            example:
              statusCode: 400
              success: false
              message: Folder already exists
              errors: []

      401:
        $ref: "#/components/responses/UnauthorizedError"

      403:
        $ref: "#/components/responses/ForbiddenError"

      404:
        description: Not Found
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiError"
            example:
              statusCode: 404
              success: false
              message: Folder not found
              errors: []

      409:
        description: Conflict
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiError"
            example:
              statusCode: 409
              success: false
              message: Folder with same name already exists at destination
              errors: []

      500:
        $ref: "#/components/responses/InternalServerError"
